<!doctype html><html lang="en"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>AccessHub Extension</title><style>body{font:14px system-ui;background:#fffaf4;color:#3d3028;width:300px;padding:16px}h1{font-size:21px}button{padding:11px 12px;border-radius:9px;border:1px solid #ae896b;background:#f8ebdf;color:#4c3327;cursor:pointer;width:100%;margin:5px 0;text-align:left}button:focus-visible{outline:3px solid #1c7da5}p{line-height:1.5}textarea{width:100%;min-height:85px}#status{min-height:22px}</style></head><body><h1>AccessHub <span style="color:#a87a57">AI</span></h1><p>Adjust only this tab, with your permission.</p><button id="contrast">Toggle high contrast</button><button id="bigger">Increase text size</button><button id="smaller">Decrease text size</button><button id="quiet">Reduce animation</button><button id="selected">Read selected text</button><label>Selected text<textarea id="output" readonly placeholder="Select text on a page, then click Read selected text."></textarea></label><button id="copy">Copy text</button><button id="reset">Reset this tab</button><p id="status" role="status" aria-live="polite"></p><p><a href="https://accesshub-ai-frontend.vercel.app" target="_blank" rel="noopener noreferrer">Open AccessHub dashboard ↗</a></p><script src="popup.js"></script></body></html>
