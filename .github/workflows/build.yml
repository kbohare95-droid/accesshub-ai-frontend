name: Verify AccessHub
on:
  push:
    branches: [main]
  pull_request:
jobs:
  frontend-and-extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify extension manifest, JavaScript and safe form behavior
        run: node extension/tests/check.mjs
      - name: Install frontend dependencies
        run: npm install
      - name: Build frontend
        run: npm run build

      - name: Install Chromium and browser test runner
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Browser regression tests for website and extension
        run: |
          npm run dev -- --host 127.0.0.1 > /tmp/accesshub-vite.log 2>&1 &
          for i in $(seq 1 40); do curl -fsS http://127.0.0.1:5173/tests/harness.html > /dev/null && break; sleep 1; done
          npm run test:browser
